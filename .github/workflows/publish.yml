name: publish

on:
  push:
    branches:
      - master

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # 可信发布要求 npm >= 11.5.1
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      # 模拟 npm 安装后的加载，避免把资源缺失的包发出去
      - name: Verify package loads
        run: |
          npm pack >/dev/null 2>&1
          TARBALL=$(ls koishi-plugin-gl-bot-*.tgz | head -1)
          mkdir -p /tmp/verify && tar -xzf "$TARBALL" -C /tmp/verify
          cd /tmp/verify/package
          node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");
            const path = require("path");
            const root = process.cwd();
            const files = execSync("find lib -name \"*.js\"").toString().trim().split("\n");
            const re = /require\(["\x27](\.[^"\x27]+)["\x27]\)/g;
            let broken = 0;
            for (const f of files) {
              const code = fs.readFileSync(path.join(root, f), "utf8");
              for (const m of code.matchAll(re)) {
                const base = path.resolve(path.dirname(path.join(root, f)), m[1]);
                const hit = ["", ".js", ".json"].some(ext => fs.existsSync(base + ext));
                if (!hit) { console.error(f + " -> " + m[1]); broken++; }
              }
            }
            if (broken) { console.error(broken + " 处资源引用缺失"); process.exit(1); }
            console.log("包内资源引用完整，检查 " + files.length + " 个模块");
          '

      - name: Detect version change
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "koishi-plugin-gl-bot@$VERSION" version >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "$VERSION 已发布于 npm，跳过"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$VERSION 尚未发布，开始发布"
          fi

      - name: Publish to npmjs.com
        if: steps.version.outputs.changed == 'true'
        run: npm publish --access public --provenance

      # GitHub Packages 要求包名带 owner scope
      - name: Publish to GitHub Packages
        if: steps.version.outputs.changed == 'true'
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.name='@gleamslime/koishi-plugin-gl-bot';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          printf '@gleamslime:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > .npmrc
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
